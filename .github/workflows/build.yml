name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build VerticalMenu (${{ matrix.scheme }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: rootless
            theos_src: https://github.com/theos/theos
          - scheme: roothide
            theos_src: https://github.com/roothide/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Theos
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/theos
          key: theos-${{ runner.os }}-${{ matrix.scheme }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            theos-${{ runner.os }}-${{ matrix.scheme }}-

      - name: Install Theos
        uses: Randomblock1/theos-action@v1.5
        with:
          theos-dir: ${{ github.workspace }}/theos
          theos-src: ${{ matrix.theos_src }}
          theos-sdks: https://github.com/theos/sdks

      - name: Put GNU make first
        run: echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Build ${{ matrix.scheme }} package
        run: |
          SDK=$(ls -d "$THEOS"/sdks/iPhoneOS*.sdk | sort -V | tail -1)
          SDKVER=$(basename "$SDK" | sed -E 's/iPhoneOS([0-9.]+)\.sdk/\1/')
          echo "Using Theos SDK $SDK ($SDKVER)"
          make clean package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=${{ matrix.scheme }} \
            TARGET="iphone:clang:${SDKVER}:16.0"
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Show packages
        run: |
          ls -lh packages
          mkdir -p dist
          for deb in packages/*.deb; do
            base="$(basename "$deb")"
            cp "$deb" "dist/${{ matrix.scheme }}-$base"
          done
          ls -lh dist

      - name: Upload .deb
        uses: actions/upload-artifact@v5
        with:
          name: verticalmenu-${{ matrix.scheme }}
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: verticalmenu-*
          merge-multiple: false

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -name '*.deb' -exec cp -v {} release/ \;
          ls -lh release
          test "$(find release -name '*.deb' | wc -l)" -ge 2

      - name: Upload combined artifact
        uses: actions/upload-artifact@v5
        with:
          name: release
          path: release/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(awk '/^Version:/{print $2; exit}' control)
          TAG="v${VERSION}"
          NOTES=$(printf '%s\n' \
            "纵向菜单 ${VERSION}" \
            "" \
            "安装对应越狱环境的 deb：" \
            "- \`rootless-*.deb\`：Dopamine / palera1n 等 rootless" \
            "- \`roothide-*.deb\`：RootHide / Bootstrap" \
            "" \
            "装完 respring，并把 Safari 等目标 App 从多任务划掉再开。")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" release/*.deb \
            --title "纵向菜单 ${VERSION}" \
            --notes "$NOTES" \
            --target "${GITHUB_SHA}"

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build VerticalMenu (${{ matrix.scheme }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: rootless
            theos_src: https://github.com/theos/theos
          - scheme: roothide
            theos_src: https://github.com/roothide/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Theos
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/theos
          key: theos-${{ runner.os }}-${{ matrix.scheme }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            theos-${{ runner.os }}-${{ matrix.scheme }}-

      - name: Install Theos
        uses: Randomblock1/theos-action@v1.5
        with:
          theos-dir: ${{ github.workspace }}/theos
          theos-src: ${{ matrix.theos_src }}
          theos-sdks: https://github.com/theos/sdks

      - name: Put GNU make first
        run: echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Build ${{ matrix.scheme }} package
        run: make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=${{ matrix.scheme }}
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Show packages
        run: |
          ls -lh packages
          mkdir -p dist
          for deb in packages/*.deb; do
            base="$(basename "$deb")"
            cp "$deb" "dist/${{ matrix.scheme }}-$base"
          done
          ls -lh dist

      - name: Upload .deb
        uses: actions/upload-artifact@v5
        with:
          name: verticalmenu-${{ matrix.scheme }}
          path: dist/*.deb
          if-no-files-found: error
